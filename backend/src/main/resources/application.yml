# =====================================================================
# TaxPulse AI - application configuration
# Every deployment-specific value is overridable through environment
# variables (12-factor). Defaults target local development.
# =====================================================================
spring:
  application:
    name: taxpulse-backend
  threads:
    virtual:
      enabled: true           # Java 21 virtual threads: cheap blocking I/O (DB + Ollama calls)

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taxpulse}
    username: ${DB_USERNAME:taxpulse}
    password: ${DB_PASSWORD:taxpulse}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 10000

  jpa:
    open-in-view: false       # avoid lazy-loading in the web layer; services own transactions
    hibernate:
      ddl-auto: validate      # schema is owned by Flyway; Hibernate only validates it
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    web:
      pageable:
        max-page-size: 100    # protects the API against huge page requests

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# ---------------------------------------------------------------------
# Application specific settings (see TaxPulseProperties / OllamaProperties)
# ---------------------------------------------------------------------
taxpulse:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-please-0123456789abcdef}
    jwt-expiration: ${JWT_EXPIRATION:PT8H}
    jwt-issuer: taxpulse
    # AES-256 key (base64 of 32 bytes) for stored client credentials. Generate: openssl rand -base64 32
    # Keep a backup: losing it makes the stored credentials unreadable.
    credentials-key: ${CREDENTIALS_ENCRYPTION_KEY:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  reminders:
    enabled: ${REMINDERS_ENABLED:true}
    days-before: 7,3,1
    cron: "0 0 7 * * *"       # every day at 07:00 (Europe/Athens)
    zone: Europe/Athens
  storage:
    root-path: ${STORAGE_ROOT:./storage}
  bootstrap:
    admin-email: ${TAXPULSE_ADMIN_EMAIL:}
    admin-password: ${TAXPULSE_ADMIN_PASSWORD:}
    admin-full-name: ${TAXPULSE_ADMIN_FULL_NAME:Διαχειριστής Συστήματος}
  notifications:
    email:
      enabled: ${NOTIFICATIONS_EMAIL_ENABLED:false}
      from: ${NOTIFICATIONS_EMAIL_FROM:no-reply@taxpulse.local}

ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  chat-model: ${OLLAMA_CHAT_MODEL:llama3.2}
  embedding-model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
  connect-timeout: PT5S
  read-timeout: ${OLLAMA_READ_TIMEOUT:PT180S}   # local CPU inference can be slow
  keep-alive: 10m
  temperature: 0.2
  context-window: ${OLLAMA_NUM_CTX:8192}
  rag:
    chunk-size: 1200          # characters per chunk
    chunk-overlap: 200
    top-k: 5
